[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifw"
version = "0.1.0"
description = "XML-driven interactive fiction RPG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ifw = "ifw.__main__:main"

[tool.setuptools.packages.find]
include = ["ifw*"]
